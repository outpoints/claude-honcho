name: Release

# Releases this fork's honcho plugin. Source carries no release version: the
# version is a dispatch input, stamped into the staged plugin.json and
# package.json at build time.
#
# Upstream (plastic-labs) stages releases on npm and mirrors the approved
# tarball onto release/honcho (release-branch.yml). This fork cannot publish
# to the @honcho-ai npm scope, and its marketplace installs the bundle from
# release/honcho directly, so this workflow builds, checks and pushes that
# branch itself, then creates the GitHub release and its tag on the exact
# commit it built.
#
# Versions are the latest upstream release the fork includes plus an
# -outpoints.N suffix (e.g. 0.4.0-outpoints.1). The suffix is required: it
# keeps fork tags from naming an upstream version, which release-branch.yml
# would otherwise mirror from npm over this fork's bundle.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.4.0-outpoints.1)"
        type: string
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    # Dispatch runs the workflow definition from the selected ref; only the
    # reviewed copy on main may release.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # release/honcho branch and GitHub release
    defaults:
      run:
        working-directory: plugins/honcho
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # No dependency cache: a release must not restore state that another
      # workflow run could have written.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ^22.22.2

      - name: Validate version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Whole-string match: [[ =~ ]] anchors reject embedded CR/LF, which
          # a line-based grep would let through into GITHUB_OUTPUT.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-outpoints\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a fork version like 0.4.0-outpoints.1"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check source
        run: |
          bunx tsc --noEmit
          bunx tsc --noEmit -p e2e
          bun test

      - name: Build release stage
        run: bun run scripts/build.ts
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}

      - name: Validate staged plugin
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.292
          claude plugin validate .stage --strict

      - name: Smoke test bundled entry points
        run: bash scripts/smoke.sh .stage

      # The marketplace installs this self-contained tree.
      - name: Push release branch
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cd .stage
          printf '.env\n.env.*\nnode_modules/\n' > .gitignore
          git init -q -b release/honcho
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "honcho v$VERSION"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" \
            push -f "https://github.com/$GITHUB_REPOSITORY.git" release/honcho

      # gh release create makes the tag server-side at --target, so the tag
      # always lands on the exact commit that was built.
      - name: Create GitHub release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="honcho-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG release already exists; skipping"
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "honcho v$VERSION" \
              --generate-notes \
              --prerelease
          fi
